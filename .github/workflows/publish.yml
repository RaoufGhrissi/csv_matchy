name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 12 needs Node >= 24.15
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^12.2.0 # has `npm stage`
      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      # The trusted publisher only allows staging: approve the release on
      # npmjs.com (or `npm stage approve <id>`) with 2FA to make it live.
      - run: npm stage publish # prepublishOnly runs the build
